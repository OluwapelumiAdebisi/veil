[package]
name = "veil-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Commitments, Orchard notes, and Halo 2 eligibility proofs for Veil"

[dependencies]
blake3 = { workspace = true }
curve25519-dalek-ng = { workspace = true }
bulletproofs = { workspace = true }
ff = "0.13"
halo2_proofs = { version = "0.3", default-features = false, features = ["batch", "floor-planner-v1-legacy-pdqsort"] }
hmac = { workspace = true }
incrementalmerkletree = "0.8.2"
orchard = { version = "0.15.1", default-features = false, features = ["std"] }
pasta_curves = "0.5"
sha2 = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
subtle = "2"
zcash_address = "0.12"
zcash_protocol = "0.9"

[[bin]]
name = "veil-crypto"
path = "src/bin/veil-crypto.rs"
