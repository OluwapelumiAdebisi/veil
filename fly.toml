app = "veil-coordinator"
primary_region = "lhr"

[build]
  dockerfile = "infrastructure/Dockerfile.api"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-2x"
  memory = "2048"
